[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "varhunt"
version = "0.1.0"
description = "Hunt for uncatalogued variable stars in TESS full-frame image light curves"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Jaroslav Holaj", email = "thezmrdus@gmail.com" }]
keywords = ["astronomy", "tess", "variable-stars", "photometry", "periodogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=7.0",
    "astroquery>=0.4.10",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[project.scripts]
varhunt = "varhunt.cli:main"

[project.urls]
Homepage = "https://github.com/jholaj/varhunt"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports (bans relative imports below)
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["varhunt"]
